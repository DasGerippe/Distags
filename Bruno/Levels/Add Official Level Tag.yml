info:
  name: Add Official Level Tag
  type: http
  seq: 9

http:
  method: PUT
  url: "{{url}}/levels/official/:slug/tags/:tagName"
  params:
    - name: slug
      value: storm-2-neon-thunder
      type: path
    - name: tagName
      value: boost-enabled
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
