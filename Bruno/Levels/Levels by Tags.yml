info:
  name: Levels by Tags
  type: http
  seq: 4

http:
  method: GET
  url: "{{url}}/levels?includeTags=sprint&excludeTags=missing-level"
  params:
    - name: includeTags
      value: sprint
      type: query
    - name: excludeTags
      value: missing-level
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
