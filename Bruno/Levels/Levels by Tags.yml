info:
  name: Levels by Tags
  type: http
  seq: 6

http:
  method: GET
  url: "{{url}}/levels?includeTags=laps&excludeTags=challenge"
  params:
    - name: includeTags
      value: laps
      type: query
    - name: excludeTags
      value: challenge
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
