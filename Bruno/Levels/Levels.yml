info:
  name: Levels
  type: http
  seq: 1

http:
  method: GET
  url: "{{url}}/levels?pageSize=10&creatorName=Refract"
  params:
    - name: pageSize
      value: "10"
      type: query
    - name: sortStrategy
      value: CreatorAsc
      type: query
      disabled: true
    - name: creatorName
      value: Refract
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
