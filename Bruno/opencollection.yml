opencollection: 1.0.0

info:
  name: Distags
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  auth:
    type: apikey
    key: Authorization
    value: SessionToken {{sessionToken}}
    placement: header
  variables:
    - name: ""
      value: ""
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
    presets:
      request:
        type: http
        url: "{{url}}"
